services:
  docmost:
    image: ghcr.io/incanta/docit:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      # Claude subscription AI (Settings > AI): either mount claude_config
      # below and run `docker compose exec docmost claude /login` once, or
      # paste a token from `claude setup-token` here.
      # CLAUDE_CODE_OAUTH_TOKEN: ''
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
      # - claude_config:/app/data/claude
      # Temp files, including Claude Code's scratch space (TMPDIR, set in the
      # Dockerfile). Without this they accumulate in the container's writable
      # layer, which can fill up with `ENOSPC ... mkdir '/app/data/tmp/claude-1000'`.
      # Nothing here is worth keeping, so `tmpfs: [/app/data/tmp]` works too if
      # you would rather spend RAM than disk and have it cleared on restart.
      # - docit_tmp:/app/data/tmp

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
  # claude_config:
  # docit_tmp:
